<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Library — Jack Johnson</title>
    <meta name="description" content="A shelf of the books Jack Johnson has read.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>

    <div id="loader">
        <div class="loader-spine"></div>
        <p>arranging the shelf&hellip;</p>
    </div>

    <header class="topbar">
        <a href="/" class="brand">library<span class="dot">.</span></a>
        <div class="topbar-right">
            <span class="book-count" id="book-count"></span>
            <a href="/" class="home-link">jackjohnson.fyi <span aria-hidden="true">&#8599;</span></a>
        </div>
    </header>

    <main id="scene-container" aria-label="3D bookshelf, drag or scroll sideways to browse, click a book for details"></main>

    <div class="nav-hint" id="nav-hint">drag or scroll to browse</div>

    <button class="shelf-arrow shelf-arrow-left" id="arrow-left" aria-label="Scroll shelf left">&#8592;</button>
    <button class="shelf-arrow shelf-arrow-right" id="arrow-right" aria-label="Scroll shelf right">&#8594;</button>

    <div class="tooltip" id="tooltip" hidden></div>

    <div class="detail-overlay" id="detail-overlay" hidden>
        <div class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detail-title">
            <button class="detail-close" id="detail-close" aria-label="Close">&times;</button>
            <div class="detail-cover">
                <img id="detail-cover-img" alt="">
            </div>
            <div class="detail-body">
                <h2 id="detail-title"></h2>
                <p class="detail-author" id="detail-author"></p>
                <div class="detail-stars" id="detail-stars" aria-hidden="true"></div>
                <p class="detail-date" id="detail-date"></p>
                <p class="detail-notes" id="detail-notes"></p>
            </div>
        </div>
    </div>

    <noscript>
        <p style="font-family: sans-serif; padding: 2rem;">This page needs JavaScript enabled to show the bookshelf.</p>
    </noscript>

    <script type="module" src="script.js"></script>
</body>
</html>
